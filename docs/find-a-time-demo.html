<title>Find a Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Source+Sans+3:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, as in the app: the match card, then each step below it. TeeMate's navy and gold. */
:root {
  --sunk: #0f1830; --bg: #141f3b; --surface: #1b2a4b; --raise: #22325a; --line: #2b3c63;
  --ink: #e8ecf5; --muted: #9aa7c4; --gold: #e3c375; --on-gold: #1a1606; --yes: #5cc28a; --no: #d9707a;
  --display: "Source Serif 4", Georgia, serif; --sys: "Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: var(--sunk); color: var(--ink); font-family: var(--sys); font-size: 16px;
  padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 460px; margin: 0 auto; display: grid; gap: 14px }
.who { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted) }
.who button { font: inherit; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer }
.who button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold) }
h1 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 4px 0 0; text-wrap: balance }
.sub { color: var(--muted); margin: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 10px }
.card.next { border-color: var(--gold) }
.kick { font-size: 13px; color: var(--muted) }
.vs { font-family: var(--display); font-size: 21px; font-weight: 600 }
.btns { display: flex; gap: 10px; flex-wrap: wrap }
button.p, button.g { font: inherit; font-weight: 800; font-size: 16px; border-radius: 14px; padding: 12px 18px; cursor: pointer; min-height: 48px }
button.p { background: var(--gold); color: var(--on-gold); border: 0 }
button.p:disabled { opacity: .45; cursor: default }
button.g { background: transparent; color: var(--ink); border: 1px solid var(--line) }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px }
.notice { background: var(--raise); border: 1px solid var(--gold); border-radius: 16px; padding: 12px 14px; display: grid; gap: 4px }
.notice b { font-size: 15px }
.notice span { color: var(--muted); font-size: 14px }
/* suggesting: a day per row, Morning / Afternoon / Evening to tick */
.days { display: grid; gap: 8px }
.day { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px }
.day .d { font-weight: 700; line-height: 1.15 }
.day .d small { display: block; color: var(--muted); font-weight: 600; font-size: 12px }
.parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px }
.parts button { font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; cursor: pointer; min-height: 40px }
.parts button[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold) }
.parts button:disabled { opacity: .35; cursor: default }
.count { font-size: 14px; color: var(--muted) }
/* the grid: each suggestion down the side, each player across */
.gridwrap { overflow-x: auto }
table { border-collapse: separate; border-spacing: 0 6px; width: 100%; min-width: 360px }
th { font-size: 12px; color: var(--muted); font-weight: 700; padding: 0 4px 2px; text-align: center; vertical-align: bottom }
th.me { color: var(--gold) }
td { background: var(--bg); padding: 8px 4px; text-align: center; border-block: 1px solid var(--line) }
td:first-child { text-align: left; padding-left: 12px; border-left: 1px solid var(--line); border-radius: 12px 0 0 12px; font-weight: 700; font-size: 14px; white-space: nowrap }
td:first-child small { display: block; color: var(--muted); font-weight: 600 }
td:last-child { border-right: 1px solid var(--line); border-radius: 0 12px 12px 0 }
tr.all td { background: rgba(92,194,138,.14); border-color: var(--yes) }
.tick { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; font-weight: 800; cursor: pointer }
.tick.y { background: var(--yes); border-color: var(--yes); color: #08210f }
.tick.n { background: transparent; border-color: var(--no); color: var(--no) }
.tick:disabled { cursor: default }
.tick:disabled:not(.y):not(.n) { opacity: .5 }
.agreed { background: rgba(92,194,138,.12); border: 1px solid var(--yes); border-radius: 16px; padding: 14px; display: grid; gap: 10px }
.agreed b { font-size: 17px }
.hint { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 0 }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--sunk); font-weight: 700; padding: 10px 16px; border-radius: 12px; max-width: calc(100vw - 32px); text-align: center }
.reset { justify-self: start; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px 0 }
@media (prefers-reduced-motion: no-preference) { .agreed, .notice { animation: in .25s ease-out } @keyframes in { from { opacity: .4; transform: translateY(-4px) } } }
</style>

<div class="wrap">
  <div class="who" role="group" aria-label="See it as">See it as <span id="who"></span></div>
  <div><h1>Mixed fourball</h1><p class="sub">Round of 32 · play by Sun 15 Nov</p></div>
  <div id="view"></div>
  <button class="reset" id="reset">Start the demo again</button>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const PLAYERS = [
  { id: 'peter', name: 'Peter', full: 'Peter Reid' }, { id: 'orla', name: 'Orla', full: 'Orla Ryan' },
  { id: 'aidan', name: 'Aidan', full: 'Aidan Kavanagh' }, { id: 'aoibhinn', name: 'Aoibhinn', full: 'Aoibhinn Kavanagh' },
]
const PARTS = ['Morning', 'Afternoon', 'Evening']
// Days from today until the play-by date (the demo starts Wed 28 Oct)
const DAYS = Array.from({ length: 12 }, (_, i) => new Date(2026, 9, 28 + i))
const dayName = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })
const MAX = 6
let S
function fresh() { S = { me: 'peter', step: 'card', picks: [], ticks: {}, by: null } }
fresh()
const key = (d, p) => `${d}|${p}`
const $ = id => document.getElementById(id)
const toast = t => { const e = $('toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (e.hidden = true), 2600) }
const me = () => PLAYERS.find(p => p.id === S.me)
const others = () => PLAYERS.filter(p => p.id !== S.me)
const allYes = k => PLAYERS.every(p => S.ticks[k]?.[p.id] === true)
const agreed = () => S.picks.find(allYes)

function draw() {
  $('who').innerHTML = PLAYERS.map(p => `<button aria-pressed="${S.me === p.id}" data-me="${p.id}">${p.name}</button>`).join(' ')
  document.querySelectorAll('[data-me]').forEach(b => (b.onclick = () => { S.me = b.dataset.me; if (S.step === 'suggest' && !S.mine) S.step = S.picks.length ? 'grid' : 'card'; draw() }))
  const v = $('view'), them = S.me === 'peter' || S.me === 'orla' ? 'Aidan & Aoibhinn Kavanagh' : 'Peter Reid & Orla Ryan'
  if (S.step === 'card') {
    v.innerHTML = `<div class="card next"><span class="kick">Your next match · Round of 32</span><span class="vs">v ${them}</span><span class="kick">Play by Sun 15 Nov</span>
      <div class="btns"><button class="p" id="find">Find a time</button><button class="g" disabled>Book this match</button></div></div>
      <p class="hint">Find a time: suggest a few days that suit you; the other three tick the ones they can do. When everyone can, book a tee time that day.</p>`
    $('find').onclick = () => { S.step = 'suggest'; S.mine = true; S.picks = []; draw() }
    return
  }
  if (S.step === 'suggest') {
    const n = S.picks.length
    v.innerHTML = `<div class="card"><b>When suits you?</b><p class="hint">Pick up to ${MAX}, before Sun 15 Nov. The other three tick the ones they can do.</p>
      <div class="days">${DAYS.map((d, i) => `<div class="day"><span class="d">${dayName(d).split(' ')[0]}<small>${dayName(d).split(' ').slice(1).join(' ')}</small></span>
        <div class="parts">${PARTS.map(p => { const k = key(i, p), on = S.picks.includes(k); return `<button aria-pressed="${on}" data-k="${k}" ${!on && n >= MAX ? 'disabled' : ''}>${p}</button>` }).join('')}</div></div>`).join('')}</div>
      <span class="count">${n} of ${MAX} picked</span>
      <div class="btns"><button class="g" id="cancel">Cancel</button><button class="p" id="send" ${n ? '' : 'disabled'}>Send to ${them.split(' & ').map(x => x.split(' ')[0]).join(' & ')} and ${S.me === 'peter' ? 'Orla' : S.me === 'orla' ? 'Peter' : S.me === 'aidan' ? 'Aoibhinn' : 'Aidan'}</button></div></div>`
    document.querySelectorAll('[data-k]').forEach(b => (b.onclick = () => { const k = b.dataset.k; S.picks = S.picks.includes(k) ? S.picks.filter(x => x !== k) : [...S.picks, k]; draw() }))
    $('cancel').onclick = () => { S.step = 'card'; S.mine = false; draw() }
    $('send').onclick = () => {
      S.picks.sort((a, b) => a.split('|')[0] - b.split('|')[0] || PARTS.indexOf(a.split('|')[1]) - PARTS.indexOf(b.split('|')[1]))
      for (const k of S.picks) S.ticks[k] = { ...(S.ticks[k] ?? {}), [S.me]: true } // you can do the ones you suggested
      S.by = S.by ?? me().name; S.step = 'grid'; S.mine = false; draw()
      toast(`Sent: the other three are told in the app`)
    }
    return
  }
  // the grid
  const a = agreed(), label = k => { const [i, p] = k.split('|'); return `${dayName(DAYS[i])}<small>${p}</small>` }
  const todo = S.picks.some(k => S.ticks[k]?.[S.me] == null)
  v.innerHTML = `${S.me !== S.by && todo ? `<div class="notice"><b>${S.by} suggests times for your Mixed fourball match</b><span>Tick the ones you can do. When everyone can, book a tee time that day.</span></div>` : ''}
    ${a ? `<div class="agreed"><b>Everyone can do ${label(a).replace('<small>', ' · ').replace('</small>', '').toLowerCase().replace(/^\w/, c => c.toUpperCase())}</b>
      <p class="hint">Book a tee time that ${a.split('|')[1].toLowerCase()}: the tee sheet opens on that day with all four ready to add. Everyone is told.</p>
      <div class="btns"><button class="p" id="book">Book a tee time · ${dayName(DAYS[a.split('|')[0]])}</button></div></div>` : ''}
    <div class="card"><b>Who can do which?</b>
      <div class="gridwrap"><table><thead><tr><th></th>${PLAYERS.map(p => `<th class="${p.id === S.me ? 'me' : ''}">${p.id === S.me ? 'You' : p.name}</th>`).join('')}</tr></thead>
      <tbody>${S.picks.map(k => `<tr class="${allYes(k) ? 'all' : ''}"><td>${label(k)}</td>${PLAYERS.map(p => { const t = S.ticks[k]?.[p.id]; const cls = t === true ? 'y' : t === false ? 'n' : ''; return `<td><button class="tick ${cls}" data-t="${k}" data-p="${p.id}" ${p.id === S.me ? '' : 'disabled'} aria-label="${p.full}: ${t === true ? 'can do it' : t === false ? "can't" : 'not answered'}">${t === true ? '✓' : t === false ? '✕' : '·'}</button></td>` }).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="hint">Tap your column: ✓ you can, tap again for ✕. Switch “See it as” above to answer as the others.</p>
      <div class="btns"><button class="g" id="more">Suggest other days</button></div></div>
    <p class="hint">Nothing agreed with a week to go to Sun 15 Nov? All four get a reminder.</p>`
  document.querySelectorAll('[data-t]').forEach(b => (b.onclick = () => {
    const k = b.dataset.t, cur = S.ticks[k]?.[S.me]
    S.ticks[k] = { ...(S.ticks[k] ?? {}), [S.me]: cur === true ? false : cur === false ? null : true }
    const was = a; draw()
    if (!was && agreed()) toast('Everyone can make it: book a tee time')
  }))
  $('more').onclick = () => { S.step = 'suggest'; S.mine = true; draw() }
  if ($('book')) $('book').onclick = () => toast(`In the app: the tee sheet for ${dayName(DAYS[a.split('|')[0]])}, ${a.split('|')[1].toLowerCase()} times, with all four added`)
}
$('reset').onclick = () => { fresh(); draw() }
draw()
</script>
