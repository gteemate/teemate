<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Event setup mockup</title>
<style>/* Layout: phone app shell matching the member's existing app — off-white ground, heavy system headings, leaf-green cards, text-only tab bar */
:root{
  --bg:#f4f4f7; --surface:#ffffff; --sunk:#e9eaf0; --ink:#151a26; --muted:#676c7a; --line:#dfe2ea;
  --green:#19335A; --on-green:#f4f6fb; --leaf:#dfe6f1; --leaf-2:#ffffff; --leaf-line:#19335A; --pill:#19335A;
  --win:#19335A; --loss:#762A43; --full:#c6cad5; --on-win:#ffffff; --on-loss:#ffffff; --shadow:rgba(25,51,90,.4);
  --rough:#6f9c55; --fair:#a3cf7c; --putt:#c6e9a4;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Cinzel",Georgia,"Times New Roman",serif; --script:"Pinyon Script","Snell Roundhand",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121a; --surface:#181d29; --sunk:#202636; --ink:#eef0f6; --muted:#9ba1b2; --line:#2a3142;
  --green:#2d548f; --on-green:#f4f6fb; --leaf:#22324d; --leaf-2:#181d29; --leaf-line:#8fb0e6; --pill:#2d548f;
  --win:#8fb0e6; --loss:#e58aa6; --full:#3a4152; --on-win:#151a26; --on-loss:#151a26; --shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a; --surface:#181d29; --sunk:#202636; --ink:#eef0f6; --muted:#9ba1b2; --line:#2a3142;
  --green:#2d548f; --on-green:#f4f6fb; --leaf:#22324d; --leaf-2:#181d29; --leaf-line:#8fb0e6; --pill:#2d548f;
  --win:#8fb0e6; --loss:#e58aa6; --full:#3a4152; --on-win:#151a26; --on-loss:#151a26; --shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--sunk);color:var(--ink);font-family:var(--sys);font-size:15px;padding-inline:16px;padding-block:24px}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.notes{max-width:300px;min-width:0;padding-top:40px}
.notes h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0 0 10px;text-wrap:balance}
.notes p{color:var(--muted);line-height:1.55;margin:0 0 12px}
.notes ol{padding-left:18px;color:var(--muted);line-height:1.6;margin:0}
.phone{width:100%;max-width:390px;height:800px;background:var(--bg);border-radius:40px;border:1px solid var(--line);
  box-shadow:0 30px 60px -30px var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
@media (max-width:460px){body{padding-inline:0;padding-block:0}.notes{display:none}
  .phone{border-radius:0;border:0;height:auto;min-height:100vh;max-width:none;box-shadow:none;overflow:visible}
  main{overflow:visible;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10}
  .cta{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
button{font-family:var(--sys)}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf-line);outline-offset:2px}
header.top{padding:22px 20px 8px;flex-shrink:0}
.top h2{font-size:34px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.05}
.top .sub{color:var(--muted);font-size:16px;margin-top:6px}
.top .sub b{color:var(--ink);font-weight:700}
.back{background:none;border:0;color:var(--muted);font-size:15px;font-weight:600;padding:4px 0;margin-bottom:6px;cursor:pointer}
main{flex:1;overflow-y:auto;min-height:0}
.screen{padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px}
/* tee times */
.dates{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 4px;scrollbar-width:none;flex-shrink:0}
.dates::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;padding:9px 0 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.day small{font-size:11px;font-weight:600;color:var(--muted)}
.day b{font-size:22px;font-weight:800;line-height:1}
.day[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}
.legend{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.period{font-size:15px;color:var(--muted);margin:6px 2px -4px}
.slot{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.slot:hover{border-color:var(--leaf-line)}
.slot.full{cursor:not-allowed;background:transparent;color:var(--muted)}
.slot .time{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.slot .meta{font-size:13px;color:var(--muted);min-width:0}
.slot .meta strong{display:block;color:var(--ink);font-weight:700;font-size:15px}
.slot.full .meta strong{color:var(--muted)}
.balls{display:flex;gap:4px}
.ball{width:12px;height:12px;border-radius:50%;background:var(--leaf);border:1.5px solid var(--leaf-line)}
.ball.taken{background:var(--full);border-color:var(--full)}
.pill{display:inline-block;background:var(--pill);color:var(--on-green);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag{margin-left:6px;vertical-align:2px;font-size:10px}
/* booking */
.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 4px}
.summary div{text-align:center;border-left:1px solid var(--line)}
.summary div:first-child{border-left:0}
.summary span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.summary b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
h3{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:8px 0 -4px}
.players,.pick{display:flex;flex-direction:column;gap:8px}
.pslot{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;border:1.5px dashed var(--line);min-height:64px}
.pslot.filled{border:2px solid var(--leaf-line);background:var(--leaf)}
.pslot.other{background:var(--surface);border:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);color:var(--ink);border:3px solid var(--green);flex-shrink:0}
.av.empty{border:2px dashed var(--muted);color:var(--muted);background:transparent}
.av.other{border-color:var(--full)}
.who{min-width:0}
.who strong{display:block;font-size:16px;font-weight:700;line-height:1.2}
.who small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;border-radius:8px;font-size:20px;line-height:1}
.brow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--line);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.brow[aria-pressed="true"]{border-color:var(--leaf-line);background:var(--leaf)}
.brow:disabled{opacity:.45;cursor:not-allowed}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;background:var(--surface)}
.brow[aria-pressed="true"] .check{background:var(--green);border-color:var(--green);color:var(--on-green)}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.cta{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;gap:12px;align-items:center}
.cta .tot{font-size:12px;color:var(--muted);line-height:1.2}
.cta .tot b{display:block;font-size:20px;font-weight:800;color:var(--ink)}
.primary{flex:1;background:var(--green);color:var(--on-green);border:0;border-radius:16px;padding:15px;font-weight:700;font-size:16px;cursor:pointer}
.primary:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer}
.ghost:disabled{opacity:.4;cursor:not-allowed}
/* lists */
.search{position:relative}
.search input{width:100%;padding:14px 14px 14px 42px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--sys)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px}
.seg button{border:0;background:none;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;overflow:hidden}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.hcp{font-size:18px;font-weight:800;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.hcp small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.add{border:2px solid var(--green);color:var(--ink);background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;cursor:pointer}
.add.on{background:var(--green);color:var(--on-green)}
.empty-state{padding:28px 16px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
/* tab bar: text only */
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:14px 2px calc(16px + env(safe-area-inset-bottom,0px));flex-shrink:0}
nav.tabs button{background:none;border:0;font-weight:600;font-size:16px;color:var(--muted);cursor:pointer;padding:4px 0;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--loss);font-weight:800}
/* confirmation + toast */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 20px}
.flagmark{width:76px;height:76px;border-radius:50%;background:var(--leaf);border:3px solid var(--leaf-line);display:grid;place-items:center;color:var(--ink);font-size:34px}
.done h4{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0}
.done p{color:var(--muted);margin:0;line-height:1.5}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:11px 16px;border-radius:12px;white-space:nowrap}
/* competitions */
.darkcard{background:var(--green);color:var(--on-green);border-radius:22px;padding:18px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.darkcard small{display:block;font-size:14px;opacity:.8}
.darkcard b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.darkcard .live{background:var(--loss);color:var(--on-loss);font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.lbwrap{overflow:hidden}
table.lb{width:100%;border-collapse:collapse;font-size:14px}
table.lb th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
table.lb td{padding:11px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.lb tr:first-child td{border-top:0}
table.lb .n{text-align:right}
table.lb td.pos{font-size:16px;font-weight:800;width:36px;text-align:center}
table.lb td.pts{font-size:19px;font-weight:800;text-align:right}
table.lb tr.me td{background:var(--leaf-2)}
table.lb td small{color:var(--muted);font-size:12px}
.status{background:var(--green);color:var(--on-green);border-radius:22px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.status .side{font-size:13px;font-weight:600;line-height:1.3;min-width:0;opacity:.9}
.status .big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.status .big small{display:block;font-size:12px;font-weight:600;opacity:.75;margin-top:5px;letter-spacing:0}
.fixtures{display:flex;flex-direction:column}
.fx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);font-size:13px}
.fx:first-child{border-top:0}
.fx .r{text-align:right}
.fx b{font-size:15px;font-weight:800;text-align:center;white-space:nowrap}
.fx .win{font-weight:800}
.result-pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700}
.result-pill.W{background:var(--win);color:var(--on-win)}.result-pill.L{background:var(--loss);color:var(--on-loss)}.result-pill.H{background:var(--full);color:var(--ink)}.result-pill.P{background:var(--sunk);color:var(--muted)}
/* hole picker grid (scorecard + course) */
.hgrid{padding:14px 10px;display:flex;flex-direction:column;gap:10px}
.hgrid .row{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.hgrid hr{border:0;border-top:1px solid var(--line);margin:0 6px}
.hc{background:none;border:0;border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.hc .num{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--surface)}
.hc .res{font-size:13px;font-weight:800;line-height:1;min-height:13px;color:var(--muted)}
.hc .res.A{color:var(--win)}.hc .res.B{color:var(--loss)}
.hc.cur{background:var(--green);color:var(--on-green)}
.hc.cur .num{background:transparent;border:2px solid var(--on-green);color:var(--on-green)}
.hc.cur .res{color:var(--on-green)}
.flagdot{width:12px;height:6px;border-radius:2px;border:1px solid rgba(0,0,0,.25)}
.matchline{display:flex;flex-direction:column;gap:2px}
.matchline span{color:var(--muted);font-size:15px}
.matchline b{font-size:21px;font-weight:800;color:var(--muted)}
.sidehead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px -2px;font-size:14px;color:var(--muted);font-weight:600}
.sidehead b{color:var(--ink)}
.pcard{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:22px;background:var(--surface);border:2px solid var(--line)}
.pcard.counts{background:var(--leaf);border-color:var(--leaf-line)}
.pcard .who strong{font-size:17px}
.pcard .who .h{color:var(--muted);font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:24px;font-weight:600;cursor:pointer;line-height:1}
.stepper output{width:34px;text-align:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper output.draft{color:var(--muted)}
.stepper.sm button{width:36px;height:36px;border-radius:11px;font-size:19px}
.stepper.sm output{font-size:20px;width:30px}
/* course */
.holetitle h4{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
.holetitle h4 span{font-size:20px;font-weight:600;color:var(--muted)}
.holetitle p{margin:4px 0 0;color:var(--muted);font-size:16px}
.mapcard{border-radius:22px;overflow:hidden;background:#efe6d3;color:#1d1a12}
.maphead{background:#0d0d0b;color:#d9c48f;display:flex;justify-content:center;align-items:baseline;gap:16px;padding:14px 10px 12px;font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.04em}
.maphead i{font-family:var(--script);font-style:normal;font-weight:400;font-size:26px;letter-spacing:0;color:#d9c48f}
.mapleg{display:flex;justify-content:center;gap:14px;padding:10px 0 4px;font-family:Georgia,serif;font-size:15px;border-bottom:1px solid #c9b48a;margin:0 50px}
.mapleg span{display:inline-flex;align-items:center;gap:4px}
.mapleg i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid #333}
.mapcard svg{display:block;width:100%;height:auto}
.pincard{padding:12px 12px 16px;display:flex;flex-direction:column;gap:14px}
.pincard>div:last-child{padding-inline:4px}
.greenpic{position:relative;border-radius:16px;overflow:hidden;background:#3d6f2f}
.greenpic img{display:block;width:100%;height:auto}
.greenpic .pin{position:absolute;width:0;height:0}
.greenpic .pin::before{content:"";position:absolute;left:-1px;bottom:0;width:2.5px;height:34px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.greenpic .pin i{position:absolute;left:1px;bottom:20px;width:18px;height:13px;clip-path:polygon(0 0,100% 50%,0 100%);border:0}
.greenpic .pin::after{content:"";position:absolute;left:-5px;top:-3px;width:10px;height:6px;border-radius:50%;background:rgba(0,0,0,.55)}
.greenpic .frontlbl{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.pincard svg{width:100%;height:auto}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px}
.facts span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.facts b{font-size:16px;font-weight:800}
.pinhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pinhead small{color:var(--muted);font-size:13px}
.fl{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.3);vertical-align:-1px;margin-right:5px}
.tip{font-size:15px;line-height:1.55;margin:0}
.holenav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* admin */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.atile{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:left;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.atile .e{font-size:30px;line-height:1;margin-bottom:12px}
.atile b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.atile span{color:var(--muted);font-size:15px;line-height:1.3}
.atile.hero{grid-column:1/-1;background:var(--green);border-color:var(--green);color:var(--on-green)}
.atile.hero span{color:var(--on-green);opacity:.85}
.atile.wide{grid-column:1/-1}
.atile.row{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;padding:16px 18px}
.atile.row .e{margin:0;font-size:26px}
.signout{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 22px;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer}
.pinrow{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pinrow:first-child{border-top:0}
.pinrow .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pinrow .t strong{font-size:16px}
.pinrow .c{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lcr{display:flex;background:var(--sunk);border-radius:11px;padding:3px}
.lcr button{border:0;background:none;width:40px;padding:7px 0;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.lcr button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--green);color:var(--on-green);font-size:13px;font-weight:800;margin-right:8px;vertical-align:3px}
.tabs-pill{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs-pill::-webkit-scrollbar{display:none}
.tabs-pill button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 18px;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer}

    <p>A clickable mockup of the new <b>Admin → Events</b> for players. Tap through the steps on the left, or use the buttons in the phone.</p>
    <div class="stepnav" id="nav"></div>
    <div class="say" id="say"></div>
  </aside>
  <div class="phone" id="app">
    <span class="mockflag">MOCKUP</span>
    <header class="top" id="hdr"></header>
    <main id="main"></main>
    <nav class="tabs" aria-label="Main"><button>Scores</button><button>Leaderboard</button><button>Course</button><button aria-current="page">Admin</button></nav>
  </div>
</div>
<script>
const $ = id => document.getElementById(id)
const P = ['Gary Cochrane','Declan Murphy','Aoife Brennan',"Ciarán O'Neill",'Siobhán Kelly','Mark Doherty','Niall Gallagher','Peter Walsh','Róisín McCarthy','Eoin Fitzgerald','Tom Byrne','Liam Quinn','Orla Ryan']
const ini = n => n.split(' ').map(x => x[0]).join('').slice(0, 2)
const sur = n => n.split(' ').slice(-1)[0]
const S = { step: 0, style: 'ryder', days: 2, club: false, picked: [0,1,2,3,4,5,6,7], team: { 0:'A',1:'A',5:'A',7:'A',2:'B',3:'B',4:'B',6:'B' } }
const A = () => S.picked.filter(i => S.team[i] === 'A'), B = () => S.picked.filter(i => S.team[i] === 'B')

const STEPS = [
  ['Events list', 'Admin → Events. Every player can create events. Yours and the club’s show here; club events (made by an admin) are seen by everyone.'],
  ['1 · Details', 'Name, start date and 1–3 days, and the format. Admins also get a “Club event” switch so the whole club sees it on the Leaderboard.'],
  ['2 · Players', 'Pick members from the club list (search by name or GUI). Members only: guests can’t be added in advance.'],
  ['3 · Teams', 'For Ryder Cup and Team Stableford: two teams with names and colours. Auto-balance by handicap, then tweak.'],
  ['4 · Draw', 'Ryder Cup only: pairs against pairs for each day. Draw at random or set them yourself. Players should book tee times together with their match.'],
  ['5 · Review', 'Check and save. Players in it see it on their Leaderboard tab from the first day; it’s private to them unless it’s a club event.'],
  ['On the day', 'What players see: the event board, scored live from everyone’s own card. No extra score entry.'],
]

function header(t, sub, back = true) { $('hdr').innerHTML = `${back ? '<button class="back" data-go="-1">‹ Back</button>' : ''}<h2>${t}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}` }
const wiz = n => `<div class="wiz">${[1,2,3,4,5].map(i => `<span class="${i <= n ? 'on' : ''}"></span>`).join('')}</div>`
const next = (label, to) => `<div class="cta"><button class="primary" data-step="${to}">${label}</button></div>`

const screens = [
  // 0 · list
  () => { header('Events', 'Set up matches and competitions in advance', false)
    return `<div class="screen">
      <button class="primary" data-step="1">+ New event</button>
      <h3>Coming up</h3>
      <div class="card evcard"><div class="who"><strong>Saturday Fourball Cup</strong><small>Ryder Cup · better ball · Sat 17 – Sun 18 Oct</small><div class="pillrow"><span class="pill">Yours</span><span class="pill ghosty">8 players · Blues v Reds</span></div></div><span class="linkbtn">Edit</span></div>
      <div class="card evcard"><div class="who"><strong>Autumn Cup</strong><small>Club event · Ryder Cup · Sat 24 Oct</small><div class="pillrow"><span class="pill" style="background:var(--loss)">Club event</span><span class="pill ghosty">12 players</span></div></div><span class="linkbtn">View</span></div>
      <div class="card evcard"><div class="who"><strong>Thursday roll-up</strong><small>Individual Stableford · Thu 15 Oct</small><div class="pillrow"><span class="pill ghosty">You’re playing · set up by Declan</span></div></div><span class="linkbtn">View</span></div>
      <h3>Finished</h3>
      <div class="card evcard" style="opacity:.75"><div class="who"><strong>September Shield</strong><small>Team Stableford · Blues 142 – 137 Reds</small></div><span class="linkbtn">Results</span></div>
    </div>` },
  // 1 · details
  () => { header('New event', 'Details')
    const styles = [['ryder','Ryder Cup','Two teams. Pairs play better-ball matches, 1 point each.'],['teams','Team Stableford','Two teams. Everyone’s Stableford points count for their team.'],['individual','Individual','A leaderboard of everyone: Stableford or net.']]
    return `<div class="screen">${wiz(1)}
      <div class="card evsec"><h4>Event</h4>
        <label>Name</label><input value="Saturday Fourball Cup">
        <div class="datepick"><div><label>First day</label><input value="Sat 17 Oct"></div><div><label>Days</label><div class="daychips">${[1,2,3].map(n => `<button data-days="${n}" aria-pressed="${S.days===n}">${n}</button>`).join('')}</div></div></div>
        <span class="hint">${S.days > 1 ? `Sat 17 – ${['','Sun 18','Mon 19'][S.days-1]} Oct. Points add up across the days.` : 'One day.'}</span>
      </div>
      <h3>Format</h3>
      <div class="games">${styles.map(([k,n,d]) => `<button class="gamecard" role="radio" aria-checked="${S.style===k}" data-style="${k}"><span class="radio"></span><span class="who"><strong>${n}</strong><small>${d}</small></span></button>`).join('')}</div>
      ${S.style === 'ryder' ? `<div class="card evsec"><label>Match format</label><select class="plainsel"><option>Better ball · off the low</option><option>Better ball · Stableford</option><option>Better ball · scratch</option></select></div>`
        : S.style === 'individual' ? `<div class="card evsec"><label>Scoring</label><select class="plainsel"><option>Stableford</option><option>Net strokeplay</option></select></div>` : ''}
      <div class="card evsec"><div class="actrow"><span class="who"><strong>Club event</strong><small>Admins only · everyone in the club sees it on the Leaderboard</small></span><button class="switch" role="switch" aria-checked="${S.club}" data-club><span></span></button></div>
        <span class="hint">${S.club ? 'Everyone in the club will see this event.' : 'Only the players you pick will see this event.'}</span></div>
    </div>${next('Next: players', 2)}` },
  // 2 · players
  () => { header('New event', 'Players')
    return `<div class="screen">${wiz(2)}
      <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input placeholder="Name or GUI number"></div>
      <div class="hint"><span class="count">${S.picked.length} picked</span>${S.style === 'ryder' ? ' · Ryder Cup needs a multiple of 4 (pairs v pairs)' : ''}</div>
      <div class="pick">${P.map((n,i) => { const on = S.picked.includes(i); return `<button class="brow" data-pick="${i}" aria-pressed="${on}"><span class="av">${ini(n)}</span><span class="who"><strong>${n}${i===0?' (you)':''}</strong><small>Index ${[12.4,8.2,15.1,4.6,22,10.3,18.7,6.9,13.5,2.1,24.8,9.9,16.2][i]}</small></span><span class="check">${on?'✓':''}</span></button>` }).join('')}</div>
    </div>${next(S.style === 'individual' ? 'Next: review' : 'Next: teams', S.style === 'individual' ? 5 : 3)}` },
  // 3 · teams
  () => { header('New event', 'Teams')
    return `<div class="screen">${wiz(3)}
      <div class="card evsec"><div class="tnames"><div><label>Team name</label><div class="trowin"><input value="Blues"><input type="color" value="#19335a"></div></div><div><label>Team name</label><div class="trowin"><input value="Reds"><input type="color" value="#762a43"></div></div></div></div>
      <div class="tcards"><div style="background:#19335a"><small>Blues</small><b>${A().length}</b><small>avg index 9.6</small></div><div style="background:#762a43"><small>Reds</small><b>${B().length}</b><small>avg index 15.1</small></div></div>
      <div class="bk-btns"><button class="ghost">Auto-balance by handicap</button><button class="ghost">Shuffle</button></div>
      <div class="card evsec"><div class="tlist">${S.picked.map(i => `<div class="trow"><span class="who"><strong>${P[i]}</strong><small>Index ${[12.4,8.2,15.1,4.6,22,10.3,18.7,6.9][i] ?? ''}</small></span><span class="tseg"><button data-tm="${i}" data-t="A" aria-pressed="${S.team[i]==='A'}" style="--tc:#19335a">Blues</button><button data-tm="${i}" data-t="B" aria-pressed="${S.team[i]==='B'}" style="--tc:#762a43">Reds</button></span></div>`).join('')}</div></div>
    </div>${next(S.style === 'ryder' ? 'Next: draw' : 'Next: review', S.style === 'ryder' ? 4 : 5)}` },
  // 4 · draw
  () => { header('New event', 'Draw')
    const day = (d, m) => `<div class="card evsec"><div class="pinhead"><h4 style="font-size:20px">Day ${d} · ${d===1?'Sat 17':'Sun 18'} Oct</h4><span class="linkbtn">Redraw</span></div>
      ${m.map(([a1,a2,b1,b2]) => `<div class="matchedit"><span style="color:#19335a">${sur(P[a1])} &amp; ${sur(P[a2])}</span><span class="v">v</span><span class="r" style="color:#762a43">${sur(P[b1])} &amp; ${sur(P[b2])}</span></div>`).join('')}
      <span class="swap">Tap a player to swap them with someone on their team</span></div>`
    return `<div class="screen">${wiz(4)}
      <div class="hint">Each match is a four-ball. Players book a tee time together as usual; the board scores each match from their cards.</div>
      ${day(1, [[0,1,2,3],[5,7,4,6]])}${S.days > 1 ? day(2, [[0,5,3,6],[1,7,2,4]]) : ''}
    </div>${next('Next: review', 5)}` },
  // 5 · review
  () => { header('New event', 'Review')
    const fmt = { ryder: 'Ryder Cup · better ball off the low', teams: 'Team Stableford', individual: 'Individual Stableford' }[S.style]
    return `<div class="screen">${wiz(5)}
      <div class="card evsec"><h4>Saturday Fourball Cup</h4><div class="sumgrid">
        <span>When</span><b>${S.days > 1 ? `Sat 17 – ${['','Sun 18','Mon 19'][S.days-1]} Oct (${S.days} days)` : 'Sat 17 Oct'}</b>
        <span>Format</span><b>${fmt}</b>
        <span>Players</span><b>${S.picked.length} members</b>
        ${S.style !== 'individual' ? `<span>Teams</span><b>Blues ${A().length} · Reds ${B().length}</b>` : ''}
        ${S.style === 'ryder' ? `<span>Matches</span><b>${2 * S.days} (${S.days} day${S.days>1?'s':''} × 2) · ${2 * S.days} points</b>` : ''}
        <span>Who sees it</span><b>${S.club ? 'Everyone in the club' : 'Only these players'}</b>
        <span>Scoring</span><b>Live from each player’s own card</b></div></div>
      <div class="hint">Players see it on their Leaderboard tab from the first day. You can edit it until the first day starts.</div>
    </div>${next('Save event', 6)}` },
  // 6 · on the day
  () => { header('Saturday Fourball Cup', 'Ryder Cup · better ball · Day 1 of 2')
    return `<div class="screen">
      <div class="seg"><button aria-pressed="false">Today</button><button aria-pressed="true">Fourball Cup</button></div>
      <div class="card evscore"><div class="tug"><i class="ta" style="width:62.5%;background:#19335a"></i><i class="tb" style="width:37.5%;background:#762a43"></i><span class="mid"></span></div>
        <div class="evteams"><div><span class="tn" style="color:#19335a">Blues</span><span class="tp" style="color:#19335a">2½ <small>projected</small></span><small>1 confirmed</small></div>
        <div class="r"><span class="tn" style="color:#762a43">Reds</span><span class="tp" style="color:#762a43">1½ <small>projected</small></span><small>0 confirmed</small></div></div>
        <div class="evfoot">2½ to win · 4 points available</div></div>
      <div class="tabs-pill"><button aria-pressed="true">Day 1</button><button aria-pressed="false">Day 2</button></div>
      <div class="card mcard"><div class="mtitle">Match 1 · 08:10</div><div class="mgrid"><div class="mside"><span class="pairav"><span class="av" style="border-color:#19335a">GC</span><span class="av" style="border-color:#19335a">DM</span></span><span>Cochrane<br>Murphy</span></div><div class="mstat"><b class="ms-big" style="color:#19335a">Blues 3&amp;2</b><small>Final</small></div><div class="mside r"><span class="pairav"><span class="av" style="border-color:#762a43">AB</span><span class="av" style="border-color:#762a43">CO</span></span><span>Brennan<br>O'Neill</span></div></div></div>
      <div class="card mcard"><div class="mtitle">Match 2 · 08:20</div><div class="mgrid"><div class="mside"><span class="pairav"><span class="av" style="border-color:#19335a">MD</span><span class="av" style="border-color:#19335a">PW</span></span><span>Doherty<br>Walsh</span></div><div class="mstat"><b class="ms-big" style="color:#762a43">1 up</b><small>thru 12 <span class="livedot">● live</span></small></div><div class="mside r"><span class="pairav"><span class="av" style="border-color:#762a43">SK</span><span class="av" style="border-color:#762a43">NG</span></span><span>Kelly<br>Gallagher</span></div></div></div>
      <div class="hint" style="text-align:center">Scores come from each player’s card and update as holes are saved.</div>
    </div>` },
]

function draw() {
  $('nav').innerHTML = STEPS.map(([t], i) => `<button data-step="${i}" aria-pressed="${S.step === i}">${t}</button>`).join('')
  $('say').textContent = STEPS[S.step][1]
  $('main').innerHTML = screens[S.step]()
  $('main').scrollTop = 0
}
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return
  if (t.dataset.step) { S.step = +t.dataset.step; return draw() }
  if (t.dataset.go) { S.step = Math.max(0, S.step - 1); if (S.step === 4 && S.style !== 'ryder') S.step = S.style === 'individual' ? 2 : 3; return draw() }
  if (t.dataset.days) { S.days = +t.dataset.days; return draw() }
  if (t.dataset.style) { S.style = t.dataset.style; return draw() }
  if ('club' in t.dataset) { S.club = !S.club; return draw() }
  if (t.dataset.pick) { const i = +t.dataset.pick; S.picked = S.picked.includes(i) ? S.picked.filter(x => x !== i) : [...S.picked, i]; if (!S.team[i]) S.team[i] = A().length <= B().length ? 'A' : 'B'; return draw() }
  if (t.dataset.tm) { S.team[+t.dataset.tm] = t.dataset.t; return draw() }
})
draw()
</script>
</body>
</html>
